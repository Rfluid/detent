name: Secret Detection

# gitleaks over the full history, as in aura. It started because GitHub's own secret
# scanning wasn't available while the repo was private; it keeps running next to GitHub's
# scanning now that the repo is public (docs/dev/ci-and-release.md).

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    gitleaks:
        name: Secret Detection (gitleaks)
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Install Gitleaks
              env:
                  GITLEAKS_VERSION: 8.28.0
              run: |
                  curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
                      | tar -xz gitleaks
                  sudo mv gitleaks /usr/local/bin/

            - name: Run Gitleaks
              run: gitleaks git --redact -v .
